name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: smoke the built binary
        run: node dist/cli.js help

  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm pack --json | jq -r '.[0].filename' > package-name
      - run: npm install --global "./$(cat package-name)"
      - run: skctl --version

  platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --json > pack-result.json
      - name: record package filename
        run: node --input-type=module -e "import { appendFileSync, readFileSync } from 'node:fs'; const [{ filename }] = JSON.parse(readFileSync('pack-result.json', 'utf8')); appendFileSync(process.env.GITHUB_ENV, 'PACKAGE_FILE=' + filename + '\n');"
      - run: npm install --global "./${{ env.PACKAGE_FILE }}"
      - run: skctl --version
